name: build-3ds-audio-diag
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX
        run: make
      - name: Upload ELF/3DSX
        uses: actions/upload-artifact@v4
        with:
          name: audio-i2s-diag-3dsx
          path: |
            audio_i2s_diag.3dsx
            audio_i2s_diag.elf
